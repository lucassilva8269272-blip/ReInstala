name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content .\version.txt -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          if ("v$version" -ne $tag) {
            throw "version.txt says $version but the tag is $tag."
          }

      - name: Build app
        shell: powershell
        run: .\build.ps1

      - name: Build installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Create or update GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @('.\dist\ReInstala.exe')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "ReInstala $tag" --generate-notes
          }
