name: Question
description: Ask how to use ReInstala or how something works.
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Describe what you are trying to do and where you got stuck.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: ReInstala version
      placeholder: "1.0.0"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
