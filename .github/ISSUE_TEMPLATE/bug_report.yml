name: Bug report
description: Something is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not paste personal data from program lists.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ReInstala
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: ReInstala version
      description: Shown in the installer window or in the file properties of ReInstala.exe.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` and paste the version and build.
      placeholder: "Windows 11 24H2 (26100.1742)"
    validations:
      required: true
  - type: input
    id: winget
    attributes:
      label: Winget version
      description: Output of `winget --version`.
      placeholder: "v1.29.380"
  - type: textarea
    id: logs
    attributes:
      label: Log (if any)
      description: |
        If the app showed an error, attach the contents of `%LOCALAPPDATA%\ReInstala\error.log`.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here to help explain the problem.
